name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check:generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:size
      - run: pnpm check:floor
      - run: pnpm test:dist
      - run: pnpm --filter pulp-docs exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm storybook:build
      # The production build, opened for real: every other test renders through the dev transform.
      - run: pnpm test:site
        env:
          PULP_VISUAL: '1'
      # A failed shot leaves its expected, actual and diff images here.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/storybook/test-results
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
