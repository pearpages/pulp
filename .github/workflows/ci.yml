name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Generated tokens must match their JSON source.
      - name: Generated output drift (tokens, icons)
        run: pnpm check:generated

      - name: Lint (ESLint + Stylelint + guardrail probe)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build packages
        run: pnpm build
      - name: Package checks (publint, are-the-types-wrong)
        run: pnpm check:package
      - name: Bundle-size budget per entry
        run: pnpm check:size
      - name: Support floor (browserslist, enforced with lightningcss)
        run: pnpm check:floor
      - name: Smoke-test the built package
        run: pnpm test:dist

      - name: Install Playwright browsers
        run: pnpm --filter pulp-docs exec playwright install --with-deps chromium
      # VITE_VISUAL: the matrix stories are compared with apps/storybook/visual-baselines.
      - name: Stories as tests (browser, a11y, visual)
        run: pnpm test:storybook
        env:
          VITE_VISUAL: '1'
      # A failed visual check leaves <Component>/<brand>-<scheme>-actual|-diff.png here.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/storybook/.vitest-attachments/visual
          if-no-files-found: ignore
      - name: Build Storybook
        run: pnpm storybook:build
