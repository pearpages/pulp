name: Publish to npm

on:
  push:
    tags: ["v*"]
  # Re-run a failed publish for an existing tag without re-tagging:
  #   gh workflow run publish.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release at the end
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only tags that point at main get published. Push main and wait for its
      # run to finish BEFORE pushing the tag, or this check sees a stale main.
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main. Tag a commit on main."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      # No registry-url on purpose: setup-node would write an empty auth token
      # to .npmrc, and that shadows trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11
      - run: pnpm install --frozen-lockfile

      - run: pnpm check:generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:size
      - run: pnpm test:dist

      # pnpm pack rewrites workspace:* to real ranges; npm publish does the
      # OIDC exchange. Each package name is registered as a Trusted Publisher
      # for this repository + this workflow file on npmjs.com. The entry's
      # workflow filename must be exactly publish.yml: an entry that does not
      # match the token fails as "OIDC token exchange error - package not
      # found" → ENEEDAUTH (0.1.0's entries said deploy.yml).
      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in packages/tokens packages/css packages/icons packages/react; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n1)
            npm publish "$tarball" --access public --provenance --loglevel verbose
          done

      # The GitHub Release, with the notes of the packages whose version this tag changed, from their
      # CHANGELOGs. Skipped when it exists, so re-running a failed publish does not fail here.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, skipping"
          else
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
